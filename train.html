<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strategrid — AI Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23111'/><rect x='2' y='2' width='13' height='13' fill='%233399ff'/><rect x='17' y='2' width='13' height='13' fill='%23ff4444'/><rect x='2' y='17' width='13' height='13' fill='%233399ff'/><rect x='17' y='17' width='13' height='13' fill='%23ff4444'/></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%; height: 100%;
      background: #111;
      font-family: 'Barlow', sans-serif;
      color: #ccc;
      overflow: hidden;
    }
    #train-wrap {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 10px;
      gap: 8px;
    }
    #train-header {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    #train-header h1 {
      font-size: 1.3rem;
      font-weight: 700;
      background: linear-gradient(90deg, #c060ff, #aaa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #train-header .subtitle {
      font-size: 0.85rem;
      color: #555;
    }
    #train-header a {
      margin-left: auto;
      font-size: 0.85rem;
      color: #555;
      text-decoration: none;
    }
    #train-header a:hover { color: #aaa; }

    #train-body {
      display: flex;
      gap: 12px;
      flex: 1;
      min-height: 0;
    }

    /* ── Left: game canvas ───────────────────────────────────────────────── */
    #train-left {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #canvasWrap {
      position: relative;
      flex-shrink: 0;
    }
    #trainCanvas {
      display: block;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
    }
    #heatmapCanvas {
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
      border-radius: 4px;
    }

    #train-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .ctrl-btn {
      padding: 6px 16px;
      font-family: 'Barlow', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid #444;
      border-radius: 4px;
      background: #222;
      color: #ccc;
      cursor: pointer;
      transition: background 0.1s;
    }
    .ctrl-btn:hover { background: #2e2e2e; }
    .ctrl-btn.active { background: #3a2a4a; border-color: #c060ff; color: #c060ff; }
    .ctrl-btn#startBtn.running { background: #2a3a2a; border-color: #4caf50; color: #4caf50; }

    #speedWrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #666;
    }
    #speedSlider {
      width: 100px;
      accent-color: #c060ff;
    }
    #speedLabel {
      min-width: 36px;
      color: #c060ff;
      font-weight: 600;
    }
    .legend-row {
      display: flex;
      gap: 14px;
      font-size: 0.75rem;
      color: #555;
    }
    .legend-dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 2px;
      margin-right: 4px;
    }

    /* ── Right: metrics panel ────────────────────────────────────────────── */
    #train-right {
      width: 280px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .panel-box {
      background: #181818;
      border: 1px solid #252525;
      border-radius: 6px;
      padding: 12px 14px;
    }
    .panel-box h3 {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 10px;
      border-bottom: 1px solid #222;
      padding-bottom: 6px;
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      padding: 3px 0;
    }
    .metric-row span:last-child {
      font-weight: 600;
      color: #ddd;
    }
    .metric-row .blue { color: #6bb8ff; }
    .metric-row .red  { color: #ff7777; }

    #chartCanvas {
      display: block;
      width: 100%;
      border-radius: 4px;
      background: #111;
    }

    /* Weight bars */
    .weight-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: #777;
      margin-bottom: 3px;
    }
    .weight-track {
      height: 8px;
      background: #222;
      border-radius: 4px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .weight-fill {
      height: 100%;
      border-radius: 4px;
      background: #c060ff;
      transition: width 0.6s ease;
    }

    /* Policy display */
    .policy-row {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.78rem; margin-bottom: 5px;
    }
    .policy-name { width: 120px; color: #aaa; flex-shrink: 0; }
    .policy-track { flex: 1; height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
    .policy-fill-blue { height: 100%; background: #6bb8ff; border-radius: 3px; transition: width 0.5s; }
    .policy-fill-red  { height: 100%; background: #ff7777; border-radius: 3px; transition: width 0.5s; }
    .policy-active { font-size: 0.65rem; padding: 1px 5px; border-radius: 3px; flex-shrink: 0; }
    .policy-active.blue { background:#1a2a3a; color:#6bb8ff; border:1px solid #6bb8ff; }
    .policy-active.red  { background:#3a1a1a; color:#ff7777; border:1px solid #ff7777; }
    .policy-active.none { opacity:0; }

    /* Status badge */
    #statusBadge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 10px;
      background: #222;
      border: 1px solid #444;
      color: #666;
    }
    #statusBadge.running { background: #1a2a1a; border-color: #4caf50; color: #4caf50; }
    #statusBadge.paused  { background: #2a2a1a; border-color: #c0a020; color: #c0a020; }
  </style>
</head>
<body>
<div id="train-wrap">
  <!-- Header -->
  <div id="train-header">
    <h1>AI Trainer</h1>
    <span class="subtitle">Self-play Q-learning</span>
    <span id="statusBadge">Initializing…</span>
    <a href="menu.html">← Menu</a>
  </div>

  <!-- Main body -->
  <div id="train-body">
    <!-- Left: canvas -->
    <div id="train-left">
      <div id="canvasWrap">
        <canvas id="trainCanvas" width="700" height="600"></canvas>
        <canvas id="heatmapCanvas" width="700" height="600"></canvas>
      </div>

      <div id="train-controls">
        <button class="ctrl-btn" id="startBtn">▶ Start</button>
        <button class="ctrl-btn" id="pauseBtn" disabled>⏸ Pause</button>
        <button class="ctrl-btn" id="resetLearningBtn">↺ Reset Learning</button>
        <button class="ctrl-btn" id="exportBtn" title="Download trained AI as JSON file">⬇ Export AI</button>
        <button class="ctrl-btn" id="importBtn" title="Load trained AI from JSON file">⬆ Import AI</button>
        <input type="file" id="importFile" accept=".json" style="display:none">
        <button class="ctrl-btn" id="clearSaveBtn" title="Delete saved progress from localStorage">🗑 Clear Save</button>

        <div id="speedWrap">
          <span>Speed</span>
          <input type="range" id="speedSlider" min="0" max="5" value="2">
          <span id="speedLabel">5×</span>
        </div>
        <div class="legend-row">
          <span><span class="legend-dot" style="background:rgba(80,220,80,0.7)"></span>Good tile</span>
          <span><span class="legend-dot" style="background:rgba(220,60,60,0.7)"></span>Bad tile</span>
          <span><span class="legend-dot" style="background:rgba(255,230,0,0.9); border:2px solid #fff;"></span>Chosen</span>
        </div>
      </div>
    </div>

    <!-- Right: metrics -->
    <div id="train-right">
      <div class="panel-box">
        <h3>Training Progress</h3>
        <div class="metric-row"><span>Episodes</span><span id="metEpisodes">0</span></div>
        <div class="metric-row"><span>Blue win rate</span><span id="metBlueWR" class="blue">—</span></div>
        <div class="metric-row"><span>Red win rate</span><span id="metRedWR"  class="red">—</span></div>
        <div class="metric-row"><span>Last winner</span><span id="metLast">—</span></div>
        <div class="metric-row"><span>Game time</span><span id="metGameTime">0s</span></div>
        <div class="metric-row" style="margin-top:6px; font-size:0.75rem; color:#555;">
          <span id="saveStatus">No save found</span>
        </div>
      </div>

      <div class="panel-box">
        <h3>Win Rate (last 50 episodes)</h3>
        <canvas id="chartCanvas" width="252" height="80"></canvas>
      </div>

      <div class="panel-box">
        <h3>Hero Policies</h3>
        <div id="policyPanel"></div>
      </div>

      <div class="panel-box" id="weightsPanel">
        <h3>Blue — Learned Weights</h3>
        <div id="weightBars"></div>
      </div>

      <div class="panel-box" id="weightsPanel2">
        <h3>Red — Learned Weights</h3>
        <div id="weightBars2"></div>
      </div>
    </div>
  </div>
</div>

<!-- Game engine scripts (same load order as game.html, minus networking/lockstep/game.js) -->
<script src="src/audioManager.js?v=2"></script>
<script src="src/gameLogic.js?v=10"></script>
<script src="src/gameActions.js?v=1"></script>
<script src="src/gameState.js?v=12"></script>
<script src="src/deckSystem.js?v=3"></script>
<script src="src/influenceSystem.js?v=3"></script>
<script src="src/phaseSystem.js?v=1"></script>
<script src="src/resourceSystem.js?v=6"></script>
<script src="src/troopSystem.js?v=16"></script>
<script src="src/buildingSystem.js?v=7"></script>
<script src="src/strategemSystem.js?v=4"></script>
<script src="src/settings.js?v=1"></script>
<script src="src/renderer.js?v=20"></script>
<script src="src/uiState.js?v=8"></script>
<script src="src/seededRandom.js?v=1"></script>
<script src="src/lockstepSystem.js?v=1"></script>
<script src="src/relayClient.js?v=2"></script>
<script src="src/networkingSystem.js?v=9"></script>
<script src="src/heroInput.js?v=10"></script>
<script src="src/gameLoop.js?v=9"></script>
<script src="src/gameSetup.js?v=6"></script>
<script src="src/heroPolicies.js?v=1"></script>
<script src="src/trainBot.js?v=4"></script>

<script>
// ── Speed mapping ────────────────────────────────────────────────────────────
const SPEEDS = [1, 2, 5, 10, 20, 50];

// ── State ────────────────────────────────────────────────────────────────────
let result      = null;  // GameSetup result
let bot1        = null;
let bot2        = null;
let running     = false;
let raf         = null;
let episodeCount = 0;
let winHistory  = [];    // 1=blue, 0=red per episode
let lastHeatmap1 = [];
let lastHeatmap2 = [];
let speed = SPEEDS[2];   // default 5x

const STORAGE_KEY = "strategrid_training_v1";

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      episodeCount,
      winHistory: winHistory.slice(-200), // keep last 200
      bot1: bot1.save(),
      bot2: bot2.save(),
      savedAt: Date.now(),
    }));
    updateSaveStatus();
  } catch (e) {
    console.warn("Save failed:", e);
  }
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    episodeCount = data.episodeCount || 0;
    winHistory   = data.winHistory   || [];
    bot1.load(data.bot1);
    bot2.load(data.bot2);
    updateSaveStatus(data.savedAt);
    return true;
  } catch (e) {
    console.warn("Load failed:", e);
    return false;
  }
}

function updateSaveStatus(savedAt) {
  const el = document.getElementById("saveStatus");
  if (!el) return;
  const existing = savedAt || (() => {
    try { const d = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); return d.savedAt; } catch { return null; }
  })();
  if (!existing) { el.textContent = "No save found"; return; }
  const mins = Math.round((Date.now() - existing) / 60000);
  const ago  = mins < 2 ? "just now" : mins < 60 ? `${mins}m ago` : `${Math.round(mins/60)}h ago`;
  el.textContent = `Saved ${ago} · ${episodeCount} episodes`;
}

const DT = 1 / 30;

// ── DOM refs ─────────────────────────────────────────────────────────────────
const trainCanvas   = document.getElementById("trainCanvas");
const heatmapCanvas = document.getElementById("heatmapCanvas");
const hCtx          = heatmapCanvas.getContext("2d");
const chartCanvas   = document.getElementById("chartCanvas");
const cCtx          = chartCanvas.getContext("2d");

const startBtn          = document.getElementById("startBtn");
const pauseBtn          = document.getElementById("pauseBtn");
const resetLearningBtn  = document.getElementById("resetLearningBtn");
const speedSlider       = document.getElementById("speedSlider");
const speedLabel        = document.getElementById("speedLabel");
const statusBadge       = document.getElementById("statusBadge");

// ── Metric elements ──────────────────────────────────────────────────────────
const metEpisodes = document.getElementById("metEpisodes");
const metBlueWR   = document.getElementById("metBlueWR");
const metRedWR    = document.getElementById("metRedWR");
const metLast     = document.getElementById("metLast");
const metGameTime = document.getElementById("metGameTime");

// ── Weight bars setup ─────────────────────────────────────────────────────────
const WEIGHT_KEYS   = ["heroHp", "tiles", "resources", "mass", "front"];
const WEIGHT_LABELS = { heroHp: "Hero HP", tiles: "Tile Control", resources: "Resources", mass: "Troop Mass", front: "Frontline" };

function buildWeightBars(containerId) {
  const container = document.getElementById(containerId);
  for (const k of WEIGHT_KEYS) {
    const label = document.createElement("div");
    label.className = "weight-label";
    label.innerHTML = `<span>${WEIGHT_LABELS[k]}</span><span id="${containerId}_${k}_val">25%</span>`;
    const track = document.createElement("div");
    track.className = "weight-track";
    const fill = document.createElement("div");
    fill.className = "weight-fill";
    fill.id = `${containerId}_${k}_fill`;
    fill.style.width = "25%";
    track.appendChild(fill);
    container.appendChild(label);
    container.appendChild(track);
  }
}
buildWeightBars("weightBars");
buildWeightBars("weightBars2");

// ── Policy panel ─────────────────────────────────────────────────────────────
function buildPolicyPanel() {
  const container = document.getElementById("policyPanel");
  if (!container || !window.HeroPolicies) return;
  container.innerHTML = "";
  for (const key of HeroPolicies.KEYS) {
    const label = HeroPolicies.LABELS[key] || key;
    const row = document.createElement("div");
    row.className = "policy-row";
    row.innerHTML = `
      <span class="policy-name">${label}</span>
      <div class="policy-track"><div class="policy-fill-blue" id="pf_b_${key}" style="width:0%"></div></div>
      <div class="policy-track"><div class="policy-fill-red"  id="pf_r_${key}" style="width:0%"></div></div>
      <span class="policy-active none" id="pa_${key}"></span>`;
    container.appendChild(row);
  }
}

function updatePolicyDisplay(b1, b2) {
  if (!window.HeroPolicies) return;
  const keys = HeroPolicies.KEYS;
  for (let i = 0; i < keys.length; i++) {
    const key = keys[i];
    // Win-rate bars: map Q-value [-1,1] to [0,100%]
    const q1 = (b1._policyQ && b1._policyQ[i]) || 0;
    const q2 = (b2._policyQ && b2._policyQ[i]) || 0;
    const fb = document.getElementById(`pf_b_${key}`);
    const fr = document.getElementById(`pf_r_${key}`);
    if (fb) fb.style.width = ((q1 * 0.5 + 0.5) * 100).toFixed(0) + "%";
    if (fr) fr.style.width = ((q2 * 0.5 + 0.5) * 100).toFixed(0) + "%";

    // Active policy badges
    const badge = document.getElementById(`pa_${key}`);
    if (!badge) continue;
    const b1Active = b1._activePolicy === key;
    const b2Active = b2._activePolicy === key;
    if (b1Active && b2Active) {
      badge.textContent = "B R"; badge.className = "policy-active blue";
    } else if (b1Active) {
      badge.textContent = "B"; badge.className = "policy-active blue";
    } else if (b2Active) {
      badge.textContent = "R"; badge.className = "policy-active red";
    } else {
      badge.textContent = ""; badge.className = "policy-active none";
    }
  }
}

function updateWeightBars(containerId, weights) {
  for (const k of WEIGHT_KEYS) {
    const pct = (weights[k] * 100).toFixed(0) + "%";
    const fillW = (weights[k] / 0.55 * 100).toFixed(1) + "%"; // normalize to max 0.55
    const fill = document.getElementById(`${containerId}_${k}_fill`);
    const val  = document.getElementById(`${containerId}_${k}_val`);
    if (fill) fill.style.width = fillW;
    if (val)  val.textContent   = pct;
  }
}

// ── Init ─────────────────────────────────────────────────────────────────────
async function init() {
  statusBadge.textContent = "Loading…";

  window.deckSystem = new DeckSystem();
  result = await GameSetup.initialize(trainCanvas);
  window.gameSetupResult = result;

  bot1 = new TrainBot("player1");
  bot2 = new TrainBot("player2");

  // Resume from last session if a save exists.
  const resumed = loadProgress();

  resetGame();

  statusBadge.textContent = "Ready";
  startBtn.disabled = false;
  pauseBtn.disabled = false;

  // Prime the display
  result.renderer.render();
  drawHeatmap();
  updateWeightBars("weightBars",  bot1.weights);
  updateWeightBars("weightBars2", bot2.weights);
  buildPolicyPanel();
  updateSaveStatus();
  if (resumed) {
    statusBadge.textContent = `Resumed · ${episodeCount} ep`;
    drawChart();
    updateMetrics(window.gameSetupResult.gameState);
  }

  // Start the loop (but paused)
  raf = requestAnimationFrame(loop);
}

// ── Reset between episodes ────────────────────────────────────────────────────
function resetGame() {
  const { gameLogic: gl, troopSystem, buildingSystem, strategemSystem,
          influenceSystem, phaseSystem, resourceSystem } = result;

  // Fresh game state
  const gs = new GameState();
  gs.tileSize = Math.floor(Math.min(trainCanvas.width / gs.cols, trainCanvas.height / gs.rows));
  gs.setGameMode("pvc"); // suppresses DOM game-over overlay

  // Update the global pointer so _spawnHeroes() can find GameLogic
  window.gameSetupResult.gameState = gs;

  gs.initialize(); // calls deckSystem.resetMatchState() + spawns heroes

  // Assign fresh random decks for training variety
  window.deckSystem.playerDecks.player1 = window.deckSystem.randomDeck();
  window.deckSystem.playerDecks.player2 = window.deckSystem.randomDeck();

  // Re-inject into all stateful systems BEFORE placing turrets so they land on gs.
  troopSystem.gameState      = gs;
  buildingSystem.gameState   = gs;
  strategemSystem.gameState  = gs;
  influenceSystem.gameState  = gs;
  phaseSystem.gameState      = gs;
  resourceSystem.gameState   = gs;
  result.heroInput.gameState = gs;
  result.buildingSystem.placeInitialTurrets(); // must be after gameState reinject
}

// ── Main loop ─────────────────────────────────────────────────────────────────
function loop() {
  raf = requestAnimationFrame(loop);
  if (!running) return;

  const { troopSystem, buildingSystem, strategemSystem,
          influenceSystem, phaseSystem, resourceSystem } = result;

  for (let i = 0; i < speed; i++) {
    const gs = window.gameSetupResult.gameState;

    if (gs.gameOver) {
      // Record outcome
      const winner = gs.winner;
      bot1.onGameOver(winner);
      bot2.onGameOver(winner);
      winHistory.push(winner === "player1" ? 1 : 0);
      episodeCount++;

      // Update metrics
      updateMetrics(gs);
      updateWeightBars("weightBars",  bot1.weights);
      updateWeightBars("weightBars2", bot2.weights);
      updatePolicyDisplay(bot1, bot2);
      drawChart();

      // Auto-save every 10 episodes.
      if (episodeCount % 10 === 0) {
        saveProgress();
      }

      resetGame();
      break; // start fresh on the next animation frame
    }

    // AI decisions every 3 ticks (0.1s of game time) for perf
    if (Math.round(gs.matchTime * 30) % 3 === 0) {
      const gl = result.gameLogic;
      const ds = window.deckSystem;
      const ss = result.strategemSystem;
      lastHeatmap1 = bot1.decide(gs, gl, ds, ss, DT) || [];
      lastHeatmap2 = bot2.decide(gs, gl, ds, ss, DT) || [];
    }

    phaseSystem.update(DT);
    if (!gs.gameOver) {
      influenceSystem.update(DT);
      resourceSystem.update(DT);
      troopSystem.update(DT);
      buildingSystem.update(DT);
      strategemSystem.update(DT);
    }
  }

  // Always render even when speed is high — render after all ticks
  const gs = window.gameSetupResult.gameState;
  result.renderer.render();
  drawHeatmap();
  metGameTime.textContent = Math.floor(gs.matchTime) + "s";
}

// ── Heatmap overlay ───────────────────────────────────────────────────────────
function drawHeatmap() {
  const gs = window.gameSetupResult.gameState;
  const ts = gs.tileSize;
  hCtx.clearRect(0, 0, heatmapCanvas.width, heatmapCanvas.height);

  // Draw Q-values: green = positive (good tile), red = negative (bad tile)
  const draw = (hm, _player) => {
    for (const { row, col, q, isBest } of hm) {
      if (q === 0 && !isBest) continue;
      const alpha = Math.min(0.65, Math.abs(q) * 1.5 + 0.05);
      hCtx.fillStyle = q >= 0
        ? `rgba(70,210,70,${alpha})`
        : `rgba(210,55,55,${alpha})`;
      hCtx.fillRect(col * ts, row * ts, ts, ts);

      if (isBest) {
        // Yellow border on the chosen spawn tile
        hCtx.strokeStyle = "rgba(255,230,0,0.9)";
        hCtx.lineWidth = 2.5;
        hCtx.strokeRect(col * ts + 1.5, row * ts + 1.5, ts - 3, ts - 3);
      }
    }
  };

  draw(lastHeatmap1, "player1");
  draw(lastHeatmap2, "player2");
}

// ── Win-rate sparkline ────────────────────────────────────────────────────────
function drawChart() {
  const W = chartCanvas.width, H = chartCanvas.height;
  cCtx.clearRect(0, 0, W, H);
  cCtx.fillStyle = "#111";
  cCtx.fillRect(0, 0, W, H);

  if (winHistory.length < 2) return;

  const window50 = winHistory.slice(-50);
  const pts = window50.length;
  const stepX = W / (pts - 1);

  // Rolling 10-episode average
  const smooth = window50.map((_, i) => {
    const slice = window50.slice(Math.max(0, i - 9), i + 1);
    return slice.reduce((s, v) => s + v, 0) / slice.length;
  });

  // 50% baseline
  cCtx.strokeStyle = "#333";
  cCtx.lineWidth = 1;
  cCtx.beginPath();
  cCtx.moveTo(0, H / 2);
  cCtx.lineTo(W, H / 2);
  cCtx.stroke();

  // Blue win rate line
  cCtx.strokeStyle = "#6bb8ff";
  cCtx.lineWidth = 2;
  cCtx.beginPath();
  smooth.forEach((v, i) => {
    const x = i * stepX, y = H - v * H;
    i === 0 ? cCtx.moveTo(x, y) : cCtx.lineTo(x, y);
  });
  cCtx.stroke();

  // Label
  cCtx.fillStyle = "#6bb8ff";
  cCtx.font = "11px Barlow, sans-serif";
  if (smooth.length) cCtx.fillText((smooth[smooth.length - 1] * 100).toFixed(0) + "%", W - 32, 14);
}

// ── Metrics text update ───────────────────────────────────────────────────────
function updateMetrics(gs) {
  metEpisodes.textContent = episodeCount;
  const wr1 = bot1.winRate;
  const wr2 = bot2.winRate;
  metBlueWR.textContent = wr1 !== null ? (wr1 * 100).toFixed(0) + "%" : "—";
  metRedWR.textContent  = wr2 !== null ? (wr2 * 100).toFixed(0) + "%" : "—";
  const w = gs.winner;
  metLast.textContent = w === "player1" ? "Blue" : w === "player2" ? "Red" : "—";
  if (metLast.style !== undefined) {
    metLast.style.color = w === "player1" ? "#6bb8ff" : w === "player2" ? "#ff7777" : "#aaa";
  }
}

// ── Controls ──────────────────────────────────────────────────────────────────
startBtn.addEventListener("click", () => {
  running = !running;
  if (running) {
    startBtn.textContent = "⏹ Stop";
    startBtn.classList.add("running");
    pauseBtn.disabled = false;
    statusBadge.textContent = "Running";
    statusBadge.className = "running";
  } else {
    startBtn.textContent = "▶ Start";
    startBtn.classList.remove("running");
    statusBadge.textContent = "Stopped";
    statusBadge.className = "";
  }
});

pauseBtn.addEventListener("click", () => {
  if (!running) return;
  running = false;
  startBtn.textContent = "▶ Resume";
  startBtn.classList.remove("running");
  statusBadge.textContent = "Paused";
  statusBadge.className = "paused";
});

resetLearningBtn.addEventListener("click", () => {
  if (!confirm("Reset all learning progress? The current save will also be cleared.")) return;
  const wasRunning = running;
  running = false;
  bot1 = new TrainBot("player1");
  bot2 = new TrainBot("player2");
  episodeCount = 0;
  winHistory = [];
  localStorage.removeItem(STORAGE_KEY);
  lastHeatmap1 = [];
  lastHeatmap2 = [];
  resetGame();
  result.renderer.render();
  drawHeatmap();
  updateWeightBars("weightBars",  bot1.weights);
  updateWeightBars("weightBars2", bot2.weights);
  cCtx.clearRect(0, 0, chartCanvas.width, chartCanvas.height);
  metEpisodes.textContent = "0";
  metBlueWR.textContent = "—";
  metRedWR.textContent = "—";
  metLast.textContent = "—";
  statusBadge.textContent = "Reset";
  statusBadge.className = "";
  updateSaveStatus();
  startBtn.textContent = "▶ Start";
  startBtn.classList.remove("running");
  if (wasRunning) {
    running = true;
    startBtn.textContent = "⏹ Stop";
    startBtn.classList.add("running");
    statusBadge.textContent = "Running";
    statusBadge.className = "running";
  }
});

document.getElementById("exportBtn").addEventListener("click", () => {
  const data = localStorage.getItem(STORAGE_KEY);
  if (!data) { alert("No training data to export yet — run some episodes first."); return; }
  const blob = new Blob([data], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `strategrid-ai-${episodeCount}ep.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById("importBtn").addEventListener("click", () => {
  document.getElementById("importFile").click();
});

document.getElementById("importFile").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      // Reload into live bots without resetting game.
      bot1.load(data.bot1);
      bot2.load(data.bot2);
      episodeCount = data.episodeCount || 0;
      winHistory   = data.winHistory   || [];
      updateSaveStatus(data.savedAt);
      updateWeightBars("weightBars",  bot1.weights);
      updateWeightBars("weightBars2", bot2.weights);
      updatePolicyDisplay(bot1, bot2);
      drawChart();
      alert(`Loaded: ${episodeCount} episodes.`);
    } catch (err) {
      alert("Import failed — not a valid training file.\n" + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

document.getElementById("clearSaveBtn").addEventListener("click", () => {
  if (!confirm("Delete saved training progress? This cannot be undone.")) return;
  localStorage.removeItem(STORAGE_KEY);
  updateSaveStatus();
});

speedSlider.addEventListener("input", () => {
  const idx = parseInt(speedSlider.value, 10);
  speed = SPEEDS[idx];
  speedLabel.textContent = speed + "×";
});
// Initialize label
speedLabel.textContent = SPEEDS[parseInt(speedSlider.value)] + "×";

// ── Boot ──────────────────────────────────────────────────────────────────────
init().catch(err => {
  console.error("Train init failed:", err);
  statusBadge.textContent = "Error — see console";
});
</script>
